<script>
  (async () => {
    const attemptMount = () => {
      if (window.mountChess) {
        window.mountChess();
        // focus to allow autoplaying media
        document.getElementById('chessRs-root').focus();
      } else {
        setTimeout(attemptMount, 20);
      }
    };
    requestAnimationFrame(() => {
      attemptMount();
    });
  })();
</script>
